services:
  postgres:
    build:
      context: ../../packages/testing/src/postgres/docker
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=effect_resonate_example
    environment:
      POSTGRES_DB: effect_resonate_example
      POSTGRES_USER: effect_resonate_example
      POSTGRES_PASSWORD: effect_resonate_example_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effect_resonate_example -d effect_resonate_example"]
      interval: 2s
      timeout: 2s
      retries: 30
