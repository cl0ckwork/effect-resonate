rc: .lefthookrc

pre-commit:
  parallel: true
  commands:
    staged-diff:
      run: git diff --cached --check
    format:
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    lint:
      glob:
        - "*.ts"
        - "**/*.ts"
        - "*.js"
        - "**/*.js"
        - "*.mjs"
        - "**/*.mjs"
      run: pnpm lint
    typecheck:
      glob:
        - "*.ts"
        - "**/*.ts"
      run: pnpm typecheck

pre-push:
  commands:
    verify:
      run: pnpm typecheck && pnpm test
