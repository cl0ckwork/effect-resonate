name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  validate:
    if: github.repository == 'cl0ckwork/effect-resonate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Check formatting of changed files
        env:
          FORMAT_BASE: ${{ github.event.before }}
        run: pnpm format:check
      - name: Validate release contents
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]; then
            pnpm version-packages
          fi
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test

  version:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update release PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm version-packages
          create-github-releases: false
    outputs:
      has_changesets: ${{ steps.changesets.outputs.has-changesets }}

  stage-check:
    needs: version
    if: needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_stage: ${{ steps.check.outputs.should_stage }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@24
          install: false
      - name: Check for an unpublished package version
        id: check
        run: node scripts/stage-packages.mjs --check

  stage:
    needs: stage-check
    if: needs.stage-check.outputs.should_stage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@24
          install: false
      - name: Install the npm CLI used for staging
        run: |
          npm install --global npm@11.20.0
          npm_stage_cli="$(npm root --global)/npm/bin/npm-cli.js"
          test "$(node "$npm_stage_cli" --version)" = "11.20.0"
          echo "NPM_STAGE_CLI=$npm_stage_cli" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Stage unpublished package versions through npm OIDC
        run: pnpm stage-packages
